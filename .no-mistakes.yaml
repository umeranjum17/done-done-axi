# no-mistakes repository config for done-done. test.instructions is honored
# only from the default-branch copy of this file.
test:
  instructions: |
    The test suite is integration and end-to-end only, and CI runs all of it
    (npm test and the e2e proof) on every PR: do not run it again here beyond
    what the diff touches. Build first: `npx tsc`. Then:
      - src/, skills/, README.md or docs/reference.md: `node --test`
      - other Markdown or LICENSE only: no tests
    Name the tests you ran and the tests you skipped, with the reason.

    The one user journey must never use the real ~/.done-done: run
    `d=$(mktemp -d); DONE_DONE_HOME="$d" node dist/cli.js run e2e; rm -rf -- "$d"`.
