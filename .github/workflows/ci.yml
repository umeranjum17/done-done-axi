name: ci

# Default pull_request types (opened, synchronize, reopened) plus
# ready_for_review, so a draft PR runs nothing until it is marked ready.
# "edited" is left out on purpose: no job here reads the PR title or body,
# so a body edit must not start a run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# This workflow runs on pull_request only, so a new push to the same PR cancels
# the run it superseded and queued duplicates stop burning runner minutes. It
# never runs on push to main or on a release, so it can never cancel a main or
# release run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A skipped job reports as passing to a required check, so a draft PR is not
  # blocked once it is marked ready (ready_for_review starts the real run).
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Docs-only PRs skip the heavy steps but the job still runs and ends
      # green, so the required check reports. Never use paths-ignore here:
      # a required check that never starts blocks the PR forever.
      - id: changes
        run: |
          docs_only=true
          for f in $(git diff --name-only HEAD^1 HEAD); do
            case "$f" in
              src/*|test/*|journeys/*|skills/*|integrations/*|dist/*|.github/*) docs_only=false ;;
              docs/*|*.md|LICENSE) ;;
              *) docs_only=false ;;
            esac
          done
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
      # The release workflow skips install, tests and publish when the
      # package version is already on npm, so a bump to a published version
      # would merge and never ship. Catch it here: a changed version must
      # not be on npm yet. Reads the public registry, needs no token.
      - name: Bumped version is unpublished
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          base=$(git show HEAD^1:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$version" = "$base" ]; then
            echo "version unchanged: $version"
            exit 0
          fi
          if [ -n "$(npm view "$name@$version" version)" ]; then
            echo "::error::$name@$version is already on npm; pick the next unpublished version"
            exit 1
          fi
          echo "$name@$version is not on npm yet"
      - if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm test
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run build:skill -- --check
  proof:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Same docs-only gate as the test job.
      - id: changes
        run: |
          docs_only=true
          for f in $(git diff --name-only HEAD^1 HEAD); do
            case "$f" in
              src/*|test/*|journeys/*|skills/*|integrations/*|dist/*|.github/*) docs_only=false ;;
              docs/*|*.md|LICENSE) ;;
              *) docs_only=false ;;
            esac
          done
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: steps.changes.outputs.docs_only != 'true'
        run: npx tsc
      # The repo drives itself with its own tool: the e2e journey runs the
      # built CLI against a throwaway fixture repo (doctor, run, check,
      # receipt, look) and fails on the first wrong exit. CI has no judge
      # of its own, and done-done gives no verdict without one, so this
      # records the run (result: recorded) and gives no receipt.
      - if: steps.changes.outputs.docs_only != 'true'
        run: node dist/cli.js run e2e
