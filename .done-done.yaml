# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "done-done"
journeys:
  e2e:
    command: node journeys/e2e.mjs
    core: true
  upgrade:
    command: node journeys/upgrade.mjs
    upgrade: true
  lint-journey-warn:
    command: node journeys/lint-journey-warn.mjs
  lint-generated:
    command: node journeys/lint-generated.mjs
  create-maintain:
    command: node journeys/create-maintain.mjs
  approved-design:
    command: node journeys/approved-design.mjs
  redesign:
    command: node journeys/redesign.mjs
  requirements-scope:
    command: node journeys/requirements-scope.mjs
  init-first-release:
    command: node journeys/init-first-release.mjs
  agents-live:
    command: node journeys/agents-live.mjs
  after-commit:
    command: node journeys/after-commit.mjs
  journey-add:
    command: node journeys/journey-add.mjs
  shared-parts:
    command: node journeys/shared-parts.mjs
  journey-enhance:
    command: node journeys/journey-add.mjs --enhance
  journey-improve:
    command: node journeys/journey-add.mjs --improve
  tier-ci:
    command: node journeys/tier-ci.mjs
  flaky-quarantine:
    command: node journeys/flaky-quarantine.mjs
  inventory-ownership:
    command: node journeys/inventory-ownership.mjs
  qa-plan:
    command: node journeys/qa-plan.mjs
  size-bounds:
    command: node journeys/size-bounds.mjs
  affected-select:
    command: node journeys/affected-select.mjs
  qa-write:
    command: node journeys/qa-write.mjs
  test-value:
    command: node journeys/test-value.mjs
  affected-audit:
    command: node journeys/affected-audit.mjs
  test-improve:
    command: node journeys/test-improve.mjs

# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
