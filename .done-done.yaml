# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "done-done"
journeys:
  route-fallback:
    command: node journeys/route-fallback.mjs
  e2e:
    command: node journeys/e2e.mjs
    tier: ci
    core: true
  upgrade:
    command: node journeys/upgrade.mjs
    upgrade: true
  lint-journey-warn:
    command: node journeys/lint-journey-warn.mjs
  lint-generated:
    command: node journeys/lint-generated.mjs
  create-maintain:
    command: node journeys/create-maintain.mjs
  approved-design:
    command: node journeys/approved-design.mjs
  redesign:
    command: node journeys/redesign.mjs
  requirements-scope:
    command: node journeys/requirements-scope.mjs
  init-first-release:
    command: node journeys/init-first-release.mjs
  agents-live:
    command: node journeys/agents-live.mjs
  after-commit:
    command: node journeys/after-commit.mjs
  journey-add:
    command: node journeys/journey-add.mjs
  shared-parts:
    command: node journeys/shared-parts.mjs
  journey-enhance:
    command: node journeys/journey-add.mjs --enhance
  journey-improve:
    command: node journeys/journey-add.mjs --improve
  tier-ci:
    command: node journeys/tier-ci.mjs
  flaky-quarantine:
    command: node journeys/flaky-quarantine.mjs
  inventory-ownership:
    command: node journeys/inventory-ownership.mjs
  qa-plan:
    command: node journeys/qa-plan.mjs
  size-bounds:
    command:
      # Enhanced focus: "Preserve every existing assertion. Add concise deterministic end-to-end coverage of tests shadow: drive five isolated synthetic journeys together via the built CLI, verify five child exits reconcile with the monotonic batch wall duration and unknown queue origin, plus a failed retry and unfinished records. Exercise provider dispatch accounting with local synthetic direct and CLI routes, including one failed attempt exactly once, a cache hit with zero new calls, missing usage as null, no prompts or credentials in the journal, and known/attempted counts. Keep runtime independent of external services and retain actual output as evidence."
      # Improved instruction: "Fix the failed generated assertions using the actual JSONL schema in src/size.ts: use kind=batch_exit with duration_ms for batch wall time, and the five kind=exit rows with start_offset_ms/end_offset_ms for reconciliation; target_ms is a target, not a child duration. Check queue_source and queue_ms null, retry_start/retry_exit and interrupted/unfinished via a safe isolated child. Assert input_tokens_or_null and output_tokens_or_null are null on provider_attempt rows lacking usage, not that all fields containing usage are null (the batch count is a string). Remove the invalid copyFileSync of a file onto itself. Check the failed CLI dispatch is journaled exactly once and cache hit makes zero new calls. Add a deterministic local synthetic direct API dispatch failure and missing-usage case with no network, prompt or credential leakage. Keep all original size-bound checks, keep total additions compact, and save actual logs."
      node journeys/size-bounds.mjs
  check-fan-out:
    command: node journeys/check-fan-out.mjs
  affected-select:
    command:
      # Enhanced focus: "Read src/affected.ts src/native-report.ts src/config.ts src/cli.ts and dist/cli.js. Exercise done-done affected main --shadow <plan.json> using clean committed synthetic fixture repositories. affected.owners maps each owner to tests and inputs glob lists. plan JSON has picks rows {test, owner, input, reason}, native queries and fallback, counts.extras and optional report when --report <junit.xml> --report-head HEAD are supplied. Use a local synthetic node_modules/.bin/jest executable to emulate a runner and make a 92 leaf owner fixture with exactly 91 extras; shared input selects both owners; a nonempty Jest result misses a subprocess input that its declaration restores, and removing that owner requires fallback. Include rename, deletion, glob member, unavailable runner, wrong report revision, JUnit parameter IDs, retries and summary-only unknown counts. Preserve every existing journey check. Use synthetic fixtures only."
      # Improved instruction: "Repair the generated shadow journey fixture after its check failed. Read src/affected.ts src/native-report.ts src/config.ts src/cli.ts and journeys/affected-select.mjs. The synthetic Jest executable must emit a nonempty version for --version and JSON arrays for --findRelatedTests --listTests --json, not newline paths. Deleted inputs must retain their declared picks and require conservative fallback, and a mismatched --report-head must be rejected without a plan. Preserve all other assertions and coverage; inspect stdout as well as stderr on a CLI failure. Keep the 92 leaf, shared owner, subprocess, unowned, glob, JUnit retry and summary cases."
      # Improved instruction: "Read src/affected.ts src/cli.ts src/native-report.ts journeys/affected-select.mjs and .agents/skills/done-done-verify-done-done/features/affected-select.md. Preserve all checks. On the same 92-leaf synthetic fixture, first drive the existing gate with done-done affected main and assert and record its result and measured wall time, then drive the shadow plan and assert and record 92 selected with 91 extras and its measured wall time. Clearly identify the existing gate as the before/control, not a prior binary; budget remains unmeasured. The generated checks documentation must state explicitly that its latest corrections supersede earlier stale statements: deletion causes incomplete fallback, wrong report revision is rejected with no plan, and the script is run by done-done after generation. Do not claim unperformed checks."
      # Improved instruction: "Read src/affected.ts src/cli.ts journeys/affected-select.mjs. Preserve all existing checks and captures. Add one synthetic end-to-end scenario: base commit declares core owner, head commit removes that owner from affected.owners and changes src/core/value.mjs, Jest returns a nonempty core test file list. Drive affected main --shadow plan.json; assert complete false, fallback names removed head declaration or head tests without owners, and base-declared picks remain in the plan. Record the actual result in the journey log. No model or network in the generated journey."
      node journeys/affected-select.mjs
  qa-write:
    command: node journeys/qa-write.mjs
  qa-prove:
    command: node journeys/qa-prove.mjs
  test-value:
    command: node journeys/value-marks.mjs
  affected-audit:
    command: node journeys/affected-audit.mjs
  test-improve:
    command: node journeys/improve-plan.mjs
  test-apply:
    command: node journeys/apply-plan.mjs
  minimum-scope:
    command: node journeys/minimum-scope.mjs
  review:
    command: node journeys/review.mjs
  review-fix:
    command: node journeys/review-fix.mjs
  verify-review:
    command: node journeys/verify-review.mjs
  registered-script:
    command: node journeys/registered-script.mjs
  affected-proof:
    command: node journeys/affected-proof.mjs
  live-tier:
    command: node journeys/live-tier.mjs
  base-ref-verify:
    command: node journeys/base-ref-verify.mjs

# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
