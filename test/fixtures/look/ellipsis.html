<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Readable row titles</title>
<style>
body { margin: 16px; font: 16px/1.5 monospace; background: #f4f4f6; color: #1c1c1e; }
h1 { font: bold 20px/1.5 sans-serif; }
.row { width: 32ch; overflow: hidden; margin: 16px 0; }
.title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<h1>Umer's review board</h1>
<div class="row"><div id="readable" class="title">Answered: the release notes are approved and ready to send</div></div>
<div class="row"><div id="nested" class="title"><span>Answered: the release notes are approved and ready to send</span></div></div>
<div class="title" id="words" style="width:10.2ch">One two I can review the release</div>
<div class="title" id="characters" style="width:21.2ch">Supercalifragilisticexpialidocious</div>
<div id="whole-lines" style="width:24ch;height:48px;line-height:24px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2">Answered: the release notes are approved and ready to send to the team</div>
</html>
